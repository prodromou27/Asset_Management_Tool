# Canonical policy for the SPA and both reverse-proxy modes. Inline styles support
# React layout values and sandboxed email previews; inline/evaluated scripts stay blocked.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; worker-src 'none'; manifest-src 'self'" always;
