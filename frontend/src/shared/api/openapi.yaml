  /api/v1/reports/{kind}/:
    get:
      operationId: reports_retrieve
      parameters:
      - in: query
        name: breakdown
        schema:
          enum:
          - site
          - category
          - manufacturer
          - owner
          type: string
          minLength: 1
        description: |-
          * `site` - site
          * `category` - category
          * `manufacturer` - manufacturer
          * `owner` - owner
      - in: query
        name: coverage
        schema:
          enum:
          - any_gap
          - endpoint_central_gap
          - defender_gap
          type: string
          minLength: 1
        description: |-
          * `any_gap` - any_gap
          * `endpoint_central_gap` - endpoint_central_gap
          * `defender_gap` - defender_gap
      - in: query
        name: dimension
        schema:
          enum:
          - hardware
          - os
          - software
          type: string
          minLength: 1
        description: |-
          * `hardware` - Hardware
          * `os` - Operating system / firmware
          * `software` - Software
      - in: query
        name: group
        schema:
          type: string
          format: uuid
      - in: path
        name: kind
        schema:
          type: string
        required: true
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
      - in: query
        name: offset
        schema:
          type: integer
          maximum: 100000
          minimum: 0
          default: 0
      - in: query
        name: q
        schema:
          type: string
          maxLength: 200
      - in: query
        name: site
        schema:
          type: string
          format: uuid
      - in: query
        name: status
        schema:
          enum:
          - supported
          - eol_announced
          - expiring
          - security_maintenance_ended
          - eos
          - not_announced
          - unknown
          - unverified
          - not_applicable
          type: string
          minLength: 1
        description: |-
          * `supported` - Supported
          * `eol_announced` - EOL announced
          * `expiring` - Approaching end of support
          * `security_maintenance_ended` - Security updates ended
          * `eos` - End of support
          * `not_announced` - Not announced
          * `unknown` - Unknown
          * `unverified` - Unverified
          * `not_applicable` - Not applicable
      tags:
      - reports
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
          description: ''
