            application/json:
              schema:
                $ref: '#/components/schemas/AssetDetail'
          description: ''
    patch:
      operationId: assets_partial_update
      parameters:
      - in: header
        name: If-Match
        schema:
          type: string
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
