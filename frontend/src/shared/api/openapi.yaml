openapi: 3.0.3
info:
  title: ITAM API
  version: v1
  description: Custom IT Asset Management and EOL/EOS platform API.
paths:
  /api/v1/asset-categories/:
    get:
      operationId: asset_categories_list
      tags:
      - asset-categories
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssetCategory'
          description: ''
    post:
      operationId: asset_categories_create
      tags:
      - asset-categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetCategoryWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssetCategoryWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssetCategoryWriteRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetCategory'
          description: ''
  /api/v1/asset-categories/{id}/:
    get:
      operationId: asset_categories_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - asset-categories
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetCategory'
          description: ''
    patch:
      operationId: asset_categories_partial_update
      parameters:
      - in: header
        name: If-Match
        schema:
          type: string
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - asset-categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAssetCategoryWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAssetCategoryWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAssetCategoryWriteRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetCategory'
          description: ''
  /api/v1/asset-categories/{id}/fields/:
    get:
      operationId: asset_categories_fields_list
      parameters:
      - in: query
        name: effective
        schema:
          type: boolean
        description: 'true: fields that apply to this category, including inherited
          ones'
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - asset-categories
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomFieldDefinition'
          description: ''
    post:
      operationId: asset_categories_fields_create
      parameters:
      - in: query
        name: effective
        schema:
          type: boolean
        description: 'true: fields that apply to this category, including inherited
          ones'
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - asset-categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFieldCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomFieldCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomFieldCreateRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldDefinition'
          description: ''
  /api/v1/assets/:
    get:
      operationId: assets_list
      parameters:
      - in: query
        name: archived
        schema:
          type: string
          enum:
          - exclude
          - include
          - only
      - in: query
        name: business_status
        schema:
          type: string
      - in: query
        name: category
        schema:
          type: string
        description: Category ID (includes subcategories)
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: department
        schema:
          type: string
      - in: query
        name: location
        schema:
          type: string
      - in: query
        name: manufacturer
        schema:
          type: string
        description: Exact, case-insensitive
      - in: query
        name: observation_status
        schema:
          type: string
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -asset_tag
          - -created_at
          - -modified_at
          - -name
          - asset_tag
          - created_at
          - modified_at
          - name
      - in: query
        name: owner
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Name, tag, serial, manufacturer, model, hostname, exact IP or
          MAC
      - in: query
        name: site
        schema:
          type: string
        description: Site ID (includes child sites)
      - in: query
        name: source
        schema:
          type: string
        description: Integration instance ID
      - in: query
        name: support_status
        schema:
          type: string
      tags:
      - assets
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssetListList'
          description: ''
    post:
      operationId: assets_create
      parameters:
      - in: query
        name: archived
        schema:
          type: string
          enum:
          - exclude
          - include
          - only
      - in: query
        name: business_status
        schema:
          type: string
      - in: query
        name: category
        schema:
          type: string
        description: Category ID (includes subcategories)
      - in: query
        name: department
        schema:
          type: string
      - in: query
        name: location
        schema:
          type: string
      - in: query
        name: manufacturer
        schema:
          type: string
        description: Exact, case-insensitive
      - in: query
        name: observation_status
        schema:
          type: string
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -asset_tag
          - -created_at
          - -modified_at
          - -name
          - asset_tag
          - created_at
          - modified_at
          - name
      - in: query
        name: owner
        schema:
          type: string
      - in: query
        name: q
        schema:
          type: string
        description: Name, tag, serial, manufacturer, model, hostname, exact IP or
          MAC
      - in: query
        name: site
        schema:
          type: string
        description: Site ID (includes child sites)
      - in: query
        name: source
        schema:
          type: string
        description: Integration instance ID
      - in: query
        name: support_status
        schema:
          type: string
      tags:
      - assets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssetWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssetWriteRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetDetail'
          description: ''
