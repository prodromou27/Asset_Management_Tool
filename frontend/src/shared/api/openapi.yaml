  /api/v1/audit/events/:
    get:
      operationId: audit_events_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
        description: Exact action code, e.g. users.disable
      - in: query
        name: actor
        schema:
          type: string
        description: Actor username (exact)
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: from
        schema:
          type: string
        description: RFC 3339 lower bound (inclusive)
      - in: query
        name: object_id
        schema:
          type: string
      - in: query
        name: object_type
        schema:
          type: string
      - in: query
        name: outcome
        schema:
          type: string
          enum:
          - denied
          - failure
          - success
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: to
        schema:
          type: string
        description: RFC 3339 upper bound (exclusive)
      tags:
