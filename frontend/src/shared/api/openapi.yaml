components:
  schemas:
    Allocation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sku:
          allOf:
          - $ref: '#/components/schemas/SkuRef'
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/DirectoryUserRef'
          readOnly: true
        method:
          allOf:
          - $ref: '#/components/schemas/AllocationMethodEnum'
          readOnly: true
        assigned_directly:
          type: boolean
          readOnly: true
        group_ids:
          type: array
          items:
            type: string
          readOnly: true
        groups:
          type: array
          items:
            $ref: '#/components/schemas/GroupRef'
          readOnly: true
        state:
          allOf:
          - $ref: '#/components/schemas/AllocationStateEnum'
          readOnly: true
        paths:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        first_seen_at:
          type: string
          format: date-time
          readOnly: true
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
        changed_at:
          type: string
          format: date-time
          readOnly: true
        ended_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - assigned_directly
      - changed_at
      - ended_at
      - first_seen_at
      - group_ids
      - groups
      - id
      - last_seen_at
      - method
      - paths
      - sku
      - state
      - user
    AllocationMethodEnum:
      enum:
      - direct
      - group
      - direct_and_group
      type: string
      description: |-
        * `direct` - direct
        * `group` - group
        * `direct_and_group` - direct_and_group
    AllocationStateEnum:
      enum:
      - Active
      - ActiveWithError
      - Disabled
      - Error
      - Unknown
      type: string
      description: |-
        * `Active` - Active
        * `ActiveWithError` - Active with error
        * `Disabled` - Disabled
        * `Error` - Error
        * `Unknown` - Unknown
