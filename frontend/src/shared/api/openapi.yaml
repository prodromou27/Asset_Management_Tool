  /api/v1/audit/events/:
    get:
      operationId: audit_events_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
        description: Exact action code, e.g. users.disable
      - in: query
        name: actor
        schema:
          type: string
        description: Actor username (exact)
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: from
        schema:
          type: string
        description: RFC 3339 lower bound (inclusive)
      - in: query
        name: object_id
        schema:
          type: string
      - in: query
        name: object_type
        schema:
          type: string
      - in: query
        name: outcome
        schema:
          type: string
          enum:
          - denied
          - failure
          - success
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: to
        schema:
          type: string
        description: RFC 3339 upper bound (exclusive)
      tags:
      - audit
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventList'
          description: ''
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: Sets the CSRF cookie so the SPA can send X-CSRFToken on unsafe
        requests.
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
