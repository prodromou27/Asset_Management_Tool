# Environment-neutral service definitions. Always combine with compose.dev.yaml
# or compose.prod.yaml. No ports are published here; PostgreSQL is the only
# database engine for every Compose environment.
name: itam

x-backend-env: &backend-env
  ITAM_ENV: ${ITAM_ENV:?ITAM_ENV is required}
  ITAM_ALLOWED_HOSTS: ${ITAM_ALLOWED_HOSTS:?ITAM_ALLOWED_HOSTS is required}
  # Optional comma-separated https origins (for example https://10.0.0.5). Same-origin
  # requests through the proxy on 443 already pass Django's origin check.
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
  # "https" (default) or "http" for an internal install without a certificate.
  ITAM_PUBLIC_SCHEME: ${ITAM_PUBLIC_SCHEME:-https}
  ITAM_TIMEZONE: ${ITAM_TIMEZONE:-Asia/Nicosia}
  ITAM_LOG_LEVEL: ${ITAM_LOG_LEVEL:-INFO}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
  POSTGRES_DB: ${POSTGRES_DB:-itam}
  POSTGRES_USER: ${POSTGRES_USER:-itam}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  # Connectors never contact a live source unless this is true AND an administrator
  # recorded approval on the integration (Task 006). Keep false until the Docker-host
  # verification has passed and a read-only source account is approved.
  ITAM_ALLOW_LIVE_INTEGRATIONS: ${ITAM_ALLOW_LIVE_INTEGRATIONS:-false}
  # Referenced from the UI as env:ITAM_INTEGRATION_LIBRENMS_TOKEN; never stored in the DB.
  ITAM_INTEGRATION_LIBRENMS_TOKEN: ${ITAM_INTEGRATION_LIBRENMS_TOKEN:-}
  # Referenced as env:ITAM_INTEGRATION_ENDPOINT_CENTRAL_KEY (read-only API key).
  ITAM_INTEGRATION_ENDPOINT_CENTRAL_KEY: ${ITAM_INTEGRATION_ENDPOINT_CENTRAL_KEY:-}
  # Intune (Task 008): fallback client secret, referenced as
  # env:ITAM_INTEGRATION_INTUNE_CLIENT_SECRET. Prefer a certificate PEM mounted as a
  # Compose secret under /run/secrets and referenced as file:<name> (see README).
  ITAM_INTEGRATION_INTUNE_CLIENT_SECRET: ${ITAM_INTEGRATION_INTUNE_CLIENT_SECRET:-}
  # Microsoft 365 licenses (Task 010): fallback client secret; prefer a certificate file.
  ITAM_INTEGRATION_M365_CLIENT_SECRET: ${ITAM_INTEGRATION_M365_CLIENT_SECRET:-}
  # Imports (Task 013): Fernet key for retained original files (derived from the Django
  # secret key when empty) and their retention in days.
  ITAM_IMPORT_ENCRYPTION_KEY: ${ITAM_IMPORT_ENCRYPTION_KEY:-}
  ITAM_IMPORT_RETENTION_DAYS: ${ITAM_IMPORT_RETENTION_DAYS:-90}
  # Exports (Task 014): hours a finished export stays downloadable, and the record limit.
  ITAM_EXPORT_RETENTION_HOURS: ${ITAM_EXPORT_RETENTION_HOURS:-24}
  ITAM_EXPORT_MAX_ROWS: ${ITAM_EXPORT_MAX_ROWS:-100000}
  # Lifecycle (Task 015): warning days before a milestone, whether extended support counts,
  # and the longest exception.
  ITAM_LIFECYCLE_WARNING_DAYS: ${ITAM_LIFECYCLE_WARNING_DAYS:-180,90}
  ITAM_LIFECYCLE_COUNT_EXTENDED_SUPPORT: ${ITAM_LIFECYCLE_COUNT_EXTENDED_SUPPORT:-false}
  ITAM_LIFECYCLE_MAX_EXCEPTION_DAYS: ${ITAM_LIFECYCLE_MAX_EXCEPTION_DAYS:-365}
  ITAM_CERT_WARNING_DAYS: ${ITAM_CERT_WARNING_DAYS:-90,60,30,14,7}
  ITAM_TLS_CHECK_INTERVAL_HOURS: ${ITAM_TLS_CHECK_INTERVAL_HOURS:-24}
  ITAM_TLS_CHECK_TIMEOUT_SECONDS: ${ITAM_TLS_CHECK_TIMEOUT_SECONDS:-5}

x-backend-depends: &backend-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-itam}
      POSTGRES_USER: ${POSTGRES_USER:-itam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  api:
    environment: *backend-env
    depends_on: *backend-depends
    healthcheck:
      test:
        - CMD
        - python
        - -c
        # Sends the first allowed host and the proxy's https marker so the check passes
        # host validation and production's HTTPS redirect without widening either.
        - "import os,sys,urllib.request as u; h=os.environ['ITAM_ALLOWED_HOSTS'].split(',')[0].strip(); r=u.Request('http://127.0.0.1:8000/api/v1/health/live/', headers={'Host': h, 'X-Forwarded-Proto': 'https'}); sys.exit(0 if u.urlopen(r, timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - backend
      - frontend

  worker:
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO"]
    environment: *backend-env
    depends_on: *backend-depends
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - backend

  scheduler:
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]
    environment: *backend-env
    depends_on: *backend-depends
    networks:
      - backend

  frontend:
    networks:
      - frontend

networks:
  backend:
  frontend:

volumes:
  postgres_data:
