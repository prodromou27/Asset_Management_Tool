# Plain-HTTP mode (ITAM_PUBLIC_SCHEME=http) for an internal install before a certificate
# exists. Passwords and session cookies cross the network unencrypted: internal use only.
# Switch with scripts/enable_https.sh.
log_format itam_private '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
access_log /var/log/nginx/access.log itam_private;
server {
    listen 80;
    server_name _;
    include /etc/nginx/snippets/content-security-policy.conf;
    proxy_hide_header Content-Security-Policy;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location = /api/v1/auth/entra/callback/ {
        access_log off;
        error_log /dev/null;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # Imports accept files up to 5 MB (Task 013); other requests stay small.
        client_max_body_size 6m;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
