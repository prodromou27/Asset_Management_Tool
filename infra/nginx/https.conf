# HTTPS mode (ITAM_PUBLIC_SCHEME=https). Port 80 only redirects to HTTPS.
# Certificate files come from ITAM_TLS_CERT_DIR (scripts/enable_https.sh).
server {
    listen 80;
    server_name _;
    include /etc/nginx/snippets/content-security-policy.conf;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    include /etc/nginx/snippets/content-security-policy.conf;
    proxy_hide_header Content-Security-Policy;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location /api/ {
        # Imports accept files up to 5 MB (Task 013); other requests stay small.
        client_max_body_size 6m;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
