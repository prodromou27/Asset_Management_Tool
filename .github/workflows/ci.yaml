name: CI

on:
  push:
    branches: [main, DEV]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (PostgreSQL + Redis)
    # Match the PostgreSQL 16 client package to the database/restore image.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: itam
          POSTGRES_USER: itam
          # Ephemeral CI-only service container credential; not used anywhere else.
          POSTGRES_PASSWORD: ci-only-ephemeral
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U itam -d itam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-test-secret
      POSTGRES_DB: itam
      POSTGRES_USER: itam
      POSTGRES_PASSWORD: ci-only-ephemeral
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      ITAM_BACKUP_DRILL_ARTIFACT_DIR: /tmp/itam-drill-fixture
      ITAM_BACKUP_TEST_SFTP: "1"
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - name: Refuse SQLite fallback in CI
        run: test -z "${ITAM_TEST_DB_SQLITE:-}"
      - run: uv sync --frozen --group dev
      - name: PostgreSQL backup and encrypted repository tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16 restic
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Migration drift check
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Apply migrations to PostgreSQL
        run: |
          uv run python manage.py migrate --no-input
          uv run python manage.py migrate --check
      - name: Migrations reverse cleanly
        run: |
          uv run python manage.py migrate backups zero --no-input
          uv run python manage.py migrate reports zero --no-input
          uv run python manage.py migrate software zero --no-input
          uv run python manage.py migrate lifecycle zero --no-input
          uv run python manage.py migrate exports zero --no-input
          uv run python manage.py migrate imports zero --no-input
          uv run python manage.py migrate groups zero --no-input
          uv run python manage.py migrate quality zero --no-input
          uv run python manage.py migrate licensing zero --no-input
          uv run python manage.py migrate security zero --no-input
          uv run python manage.py migrate network zero --no-input
          uv run python manage.py migrate reconciliation zero --no-input
          uv run python manage.py migrate observations zero --no-input
          uv run python manage.py migrate integrations zero --no-input
          uv run python manage.py migrate assets zero --no-input
          uv run python manage.py migrate organizations zero --no-input
          uv run python manage.py migrate audit zero --no-input
          uv run python manage.py migrate accounts zero --no-input
          uv run python manage.py migrate --no-input
      - name: OpenAPI schema validation and drift check
        run: |
          uv run python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yaml
          diff -u ../frontend/src/shared/api/openapi.yaml /tmp/schema.yaml
      - name: Unit + PostgreSQL/Redis integration tests (no skips allowed)
        run: |
          uv run python -m pytest -q -rs | tee /tmp/pytest.log
          ! grep -q "SKIPPED" /tmp/pytest.log
      - name: Production settings deploy check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          ITAM_ALLOWED_HOSTS: itam.ci.invalid
        run: |
          export DJANGO_SECRET_KEY="$(python3 -c 'import secrets;print(secrets.token_urlsafe(64))')"
          uv run python manage.py check --deploy --fail-level WARNING
      - name: Preserve synthetic restore fixture for the isolated Docker drill
        uses: actions/upload-artifact@v4
        with:
          name: backup-drill-fixture
          path: /tmp/itam-drill-fixture
          retention-days: 1
          if-no-files-found: error
      - name: Preserve separate synthetic recovery key (never a production key)
        uses: actions/upload-artifact@v4
        with:
          name: backup-drill-key
          path: /tmp/itam-drill-key
          retention-days: 1
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated API types match committed OpenAPI schema
        run: |
          pnpm run gen:api
          git diff --exit-code -- src/shared/api/schema.d.ts
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  pilot:
    name: Real API + browser pilot (synthetic)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: itam_pilot
          POSTGRES_USER: itam
          POSTGRES_PASSWORD: ci-only-pilot-ephemeral
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U itam -d itam_pilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DB: itam_pilot
      POSTGRES_USER: itam
      POSTGRES_PASSWORD: ci-only-pilot-ephemeral
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      ITAM_UI_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - name: Sync backend test dependencies
        working-directory: backend
        run: uv sync --frozen --group dev
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Sync frontend and browser
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Pilot lint and format
        run: |
          backend/.venv/bin/ruff check --config backend/pyproject.toml ops/pilot
          backend/.venv/bin/ruff format --check --config backend/pyproject.toml ops/pilot
      - name: Real loopback browser and database rehearsal
        working-directory: frontend
        run: |
          test -z "${ITAM_TEST_DB_SQLITE:-}"
          pnpm e2e
      - name: Preserve synthetic pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-browser-pilot
          path: frontend/test-results/pilot/
          retention-days: 7
          if-no-files-found: warn

  reference-load:
    name: PostgreSQL synthetic reference load
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: itam_load
          POSTGRES_USER: itam
          POSTGRES_PASSWORD: ci-only-load-ephemeral
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U itam -d itam_load"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DB: itam_load
      POSTGRES_USER: itam
      POSTGRES_PASSWORD: ci-only-load-ephemeral
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - name: Sync test dependencies
        working-directory: backend
        run: uv sync --frozen --group dev
      - name: Load harness lint and guards
        run: |
          backend/.venv/bin/ruff check --config backend/pyproject.toml ops/load
          backend/.venv/bin/ruff format --check --config backend/pyproject.toml ops/load
          backend/.venv/bin/python -m pytest ops/load/test_guards.py -q -p no:cacheprovider
      - name: Measure synthetic reference workload
        run: backend/.venv/bin/python ops/load/run_reference.py
      - name: Preserve reference measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-reference-load
          path: ops/load/results/report.json
          retention-days: 7
          if-no-files-found: warn

  compose:
    name: Compose config + image build
    needs: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Write throwaway CI env file
        run: |
          {
            echo "ITAM_ENV=ci"
            echo "ITAM_ALLOWED_HOSTS=itam.ci.invalid"
            echo "DJANGO_SECRET_KEY=$(python3 -c 'import secrets;print(secrets.token_urlsafe(64))')"
            echo "POSTGRES_PASSWORD=$(python3 -c 'import secrets;print(secrets.token_urlsafe(24))')"
          } > .env
      - name: Validate dev and prod compose
        run: |
          bash scripts/compose.sh dev config --quiet
          bash scripts/compose.sh prod config --quiet
      - name: Prod must not publish PostgreSQL or Redis ports
        run: |
          bash scripts/compose.sh prod config --format json > /tmp/prod.json
          test "$(jq '[.services.postgres.ports // [], .services.redis.ports // []] | add | length' /tmp/prod.json)" = "0"
          test "$(jq -r '[.services[] | select(.ports) | .ports[].published] | join(",")' /tmp/prod.json)" = "80,443"
          test "$(jq -r '.services.api.environment.DJANGO_SETTINGS_MODULE' /tmp/prod.json)" = "config.settings.production"
          test "$(jq -r '.services.api.environment.ITAM_DEBUG' /tmp/prod.json)" = "false"
          test "$(jq '.services | has("mailpit")' /tmp/prod.json)" = "false"
      - name: Plain-HTTP install mode selects the HTTP proxy config
        run: |
          ITAM_PUBLIC_SCHEME=http bash scripts/compose.sh prod config --format json > /tmp/http.json
          jq -e '.services["nginx-proxy"].volumes[] | select(.target == "/etc/nginx/conf.d/default.conf") | .source | endswith("infra/nginx/http.conf")' /tmp/http.json
          jq -e '.services.api.environment.ITAM_PUBLIC_SCHEME == "http"' /tmp/http.json
      - name: Build production images
        run: bash scripts/compose.sh prod build api frontend
      - name: Build restricted backup worker
        run: docker compose --env-file .env -f infra/compose.yaml -f infra/compose.prod.yaml --profile backups build backup-worker
      - name: Download synthetic restore fixture
        uses: actions/download-artifact@v4
        with:
          name: backup-drill-fixture
          path: /tmp/itam-drill-fixture
      - name: Restore into new network-disabled PostgreSQL and verify recovery
        # Both artifacts contain synthetic CI data only, with a one-day lifetime.
        uses: actions/download-artifact@v4
        with:
          name: backup-drill-key
          path: /tmp/itam-drill-key
      - name: Verify encrypted repository and restore after source removal
        run: |
          sudo apt-get update && sudo apt-get install -y restic
          python3 ops/restore/recover_fixture.py /tmp/itam-drill-fixture /tmp/itam-drill-key/restic_password /tmp/itam-drill-input
          python3 ops/restore/drill.py /tmp/itam-drill-input --report /tmp/itam-drill-report.json
      - name: Preserve measured isolated restore report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-drill-report
          path: /tmp/itam-drill-report.json
          retention-days: 7
          if-no-files-found: warn
