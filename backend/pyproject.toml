[project]
name = "itam-backend"
version = "0.1.0"
description = "ITAM platform API (Django + DRF)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django[argon2]>=5.2.18,<5.3",
    "djangorestframework>=3.18,<3.19",
    "django-cors-headers>=4.9,<4.10",
    "django-environ>=0.14,<0.15",
    "psycopg[binary]>=3.3,<3.4",
    "celery[redis]>=5.6,<5.7",
    "redis>=5.2",
    "drf-spectacular>=0.30,<0.31",
    "gunicorn>=26.2,<27",
    "httpx>=0.28,<0.29",
    "cryptography>=50.0.2,<51",
]

[dependency-groups]
dev = [
    "pytest>=9.2,<9.3",
    "pytest-django>=4.14,<4.15",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<2.5",
    "django-stubs>=5.2,<5.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests", "apps"]
addopts = "--strict-markers"
markers = [
    "integration: requires real PostgreSQL and Redis (skipped under the SQLite fallback)",
]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.12"
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.base"
